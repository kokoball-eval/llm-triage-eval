# ─────────────────────────────────────────────────────────────
# 사람별 계정 예시 — 이 파일은 읽히지 않는다. 같은 폴더에 사용자.local.toml(git 제외)로 복사해 고쳐 쓴다.
# 사용자.local.toml 이 있으면 서비스는 사람마다 로그인해야 쓰고(이 PC 에서도), "내 업무"는 로그인한 사람 기준이 된다.
#
#   id       로그인 이름 (영문 소문자·숫자·_·- 2~32자)
#   name     화면과 기록(QA 동작의 실행한 사람, BTS 코멘트)에 보일 이름
#   role     leader(팀장·파트장) | member(실무자)  — 리더가 한 명 이상 있어야 한다
#   bts      BTS 구성원 ID: Jira 는 accountId, Redmine 은 사용자 번호(글자로). triage-serve --check 가 팀 그룹 구성원인지 확인한다
#   password 비밀번호 해시 — uv run triage-user hash 로 만든 값을 붙여 넣는다(평문 금지)
# ─────────────────────────────────────────────────────────────

[[user]]
id = "qa-lead"
name = "QA팀장"
role = "leader"
bts = "your-qa-lead-account-id"
password = "scrypt$여기에-triage-user-hash-결과$붙여넣기"

[[user]]
id = "qa-member"
name = "QA팀원"
role = "member"
bts = "your-qa-member-account-id"
password = "scrypt$여기에-triage-user-hash-결과$붙여넣기"
