# ─────────────────────────────────────────────────────────────
# 링크 출처 설정 — 작업 페이지의 [링크로 가져오기]가 시작할 때 읽고 검사한다(src/triage_service/intake/settings.py).
#
# 여기에 적은 곳에서만 리포트를 가져온다(임의 주소 요청 방지). 사이트마다 다른 HTML 위치(선택자)도 여기서 정한다.
# 회사가 수집을 허락한 곳(사내 공식 게시판, 회사 봇이 들어간 디스코드 서버)만 넣는다. 외부 커뮤니티는 이용 약관과
# robots 규칙을 먼저 확인한다.
# 실제 사이트 값은 설정/출처.local.toml(git 제외)에 두면 이 파일 대신 읽는다. 토큰은 .env 에만 둔다.
# ─────────────────────────────────────────────────────────────

[fetch]
timeout_sec = 10
max_bytes = 1000000          # 한 번에 받을 응답 크기 상한(바이트). 넘으면 가져오기를 멈춘다

# ── BTS 이슈 링크 ────────────────────────────────────────────
# 주소·토큰은 BTS 연결 설정(설정/bts_매핑*.toml, .env)의 것을 쓴다. 토큰이 없으면 이 출처는 꺼진다.
# 가져온 이슈는 측정 때의 입력 종류 B(QA 이슈)로 들어간다. reporter 는 측정한 평가셋 값 중 하나여야 한다.
[jira]
enabled = true
reporter = "내부 QA"

[redmine]
enabled = true
reporter = "내부 QA"

# ── 게시판 (입력 종류 A · 커뮤니티 제보) ─────────────────────────
# domain 은 호스트[:포트]. 선택자는 CSS 선택자(beautifulsoup4). posted_at 은 비워 두면 가져온 시각을 쓴다.
[[board]]
name = "견본 게시판"
domain = "127.0.0.1:8765"
board = "공식 홈페이지 > 버그 제보"
path_prefix = "/board/"
title = "h1.post-title"
body = "div.post-body"
posted_at = "time.post-date"

# ── 디스코드 (입력 종류 A · 커뮤니티 제보) ───────────────────────
# 회사 봇이 들어가 있는 서버의 메시지 링크만 가져온다. 토큰: .env 의 DISCORD_BOT_TOKEN
[discord]
enabled = false
board = "디스코드 > #버그-제보"
