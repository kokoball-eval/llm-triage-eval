<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}트리아지 작업 페이지{% endblock %}</title>
  <style>
    :root { --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --bg:#fff; --soft:#f6f8fa; --accent:#0969da;
            --bad:#cf222e; --ok:#1a7f37; --warn:#9a6700; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.6 system-ui, "Malgun Gothic", sans-serif; color:var(--fg); background:var(--bg); }
    header { border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:16px; align-items:center; }
    header a { color:var(--fg); text-decoration:none; font-weight:600; }
    main { max-width:960px; margin:0 auto; padding:16px; }
    a { color:var(--accent); }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; white-space:nowrap; }
    .state { display:inline-block; padding:0 8px; border-radius:10px; background:var(--soft); border:1px solid var(--line); font-size:13px; white-space:nowrap; }
    .state.실패 { color:var(--bad); border-color:var(--bad); }
    .state.등록\ 완료 { color:var(--ok); border-color:var(--ok); }
    .state.검토\ 대기 { color:var(--warn); border-color:var(--warn); }
    .box { border:1px solid var(--line); border-radius:6px; padding:12px 16px; margin:12px 0; background:var(--soft); }
    .error { border-color:var(--bad); color:var(--bad); background:#fff; }
    .muted { color:var(--muted); font-size:13px; }
    pre { white-space:pre-wrap; word-break:break-word; margin:0; font:inherit; }
    label { display:block; font-weight:600; margin:12px 0 4px; }
    input[type=text], textarea, select { width:100%; padding:6px 8px; font:inherit; border:1px solid var(--line); border-radius:6px; }
    textarea { min-height:160px; }
    .checks label { display:inline-block; font-weight:400; margin:2px 12px 2px 0; }
    button { font:inherit; padding:6px 16px; border-radius:6px; border:1px solid var(--line); background:var(--soft); cursor:pointer; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
    nav.filter a { margin-right:12px; }
  </style>
</head>
<body>
  <header><a href="/">트리아지 작업 페이지</a><a href="/new">+ 새 리포트</a></header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
