# ─────────────────────────────────────────────────────────────
# v1.5 확신도 기반 라우팅 — 개발용 기준선 단계(7단계)의 신호 정의와 후보 선택 규칙
#
# 계획: report/routing_v15_plan.md
# 개발용 기록으로 후보를 재기 전에 확정한다 (2026-11-16). 결과를 본 뒤 이 파일의 값을 바꾸지 않는다.
# 이 단계는 후보를 고르기만 한다. 채택 판정과 최종 목표(위험 건 누락 0·날조 0)는 새 최종 평가용 세트(9단계)에서 한다.
#
# 규칙
#   1. 라우팅 단위는 응답 1건이다. 검토 큐에 보내는 응답과 자동 등록하는 응답으로 나눈다.
#   2. 신호는 응답·입력·같은 문항의 다른 응답만 본다. 정답 라벨은 보지 않는다(테스트로 확인).
#   3. 신호는 비용이 낮은 순서(S1 → S2 → S4 → S3)로, 지금 선택한 집합에 하나씩 더해 본다. 거절한 신호는 다음 후보에 섞지 않는다.
#   4. 선택은 [selection] 의 순차 규칙으로 한다. 비율은 반올림 전의 정수 비율로 비교한다. 임계값을 개발용 결과에 맞춰 조정하지 않는다.
#   5. 개발용 문항은 프롬프트를 다듬는 데 쓴 문항이라 결과가 낙관적일 수 있다(KL-003). 그래서 이 결과로 채택하지 않는다.
# ─────────────────────────────────────────────────────────────

[meta]
version = "1.5"
target_model = "qwen2.5:7b"
inputs = "data/eval_v14/aether_raid_v14.json"       # 모델이 본 입력
labels = "data/eval_v15/aether_raid_v15.json"       # 채점 정답표 (v1.5)
split = "dev"
baseline = [
  "data/results/v14/baseline/v14_dev_m2_seed1_baseline.json",
  "data/results/v14/baseline/v14_dev_m2_seed11_baseline.json",
  "data/results/v14/baseline/v14_dev_m2_seed21_baseline.json",
]

# ── 신호 ─────────────────────────────────────────────────────
[signals]
# S1 판정값: 최종 응답(안전장치 적용 뒤)의 처리가 아래 값이거나 우선순위가 아래 값이면 검토
review_actions = ["긴급 사인 요청", "정보 요청 후 보류"]
review_priorities = ["Critical", "판단보류"]
# S2 파이프라인 흔적은 코드에 고정(형식 재요청, 안전장치 적용, Critical 상향, 폐기 보류, 형식 위반, 출력 잘림, 실패)
# S3 반복 불일치: 같은 문항 응답(seed 3개 × 2회)에서 아래 칸의 값 조합이 하나라도 다르면 그 문항의 모든 응답을 검토
agreement_fields = ["우선순위", "처리"]
expected_responses_per_item = 6
# S4 날조 탐지기(v1.2 규칙 기반)가 날조로 본 응답은 검토

# ── 후보 선택 ────────────────────────────────────────────────
[selection]
accuracy_fields = ["우선순위", "모듈", "처리"]   # 자동 처리분 정확도: 이 세 칸이 모두 허용 답 안인 응답의 비율
accuracy_gain_min = 2.0       # 위험·날조 통과가 같을 때 다음 후보로 바꾸려면 자동 처리분 정확도가 이만큼(%p) 올라야 한다
auto_rate_floor = 30.0        # 자동 처리율(%)이 이보다 낮은 후보는 선택하지 않는다 (근거 없이 정한 안전장치 값, 계획 §5)
