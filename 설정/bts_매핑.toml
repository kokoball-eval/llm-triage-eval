# ─────────────────────────────────────────────────────────────
# BTS 연결 설정 — 작업 페이지(uv run triage-serve)가 시작할 때 읽고 검사한다(src/triage_service/bts/settings.py).
#
# 회사마다 다른 값(주소·프로젝트·우선순위 이름)은 이 파일에서만 바꾼다. 코드는 고치지 않는다.
# 토큰은 여기에 적지 않는다. 환경 변수(또는 저장소 루트의 .env, git 제외)로만 넣는다:
#   Jira    — JIRA_EMAIL, JIRA_API_TOKEN
#   Redmine — REDMINE_API_KEY
# 검사에 걸리면(모르는 키, 빠진 우선순위 대응, 토큰 없음) 서버가 시작하지 않는다. 대응이 빠진 채 돌면
# 등록할 때마다 엉뚱한 값이 BTS 에 조용히 들어가기 때문이다.
#
# BTS 쪽에서 맞춰 둘 것 (설정 파일이 아니라 BTS 관리 화면에서):
#   티켓 상태 다섯 개 — QA Review(QA 재현 확인 중) · In Dev(개발 대응 중) · Resolve(수정 완료, QA 회귀 테스트 필요)
#                       · Check(대응 보류, 사유 코멘트) · Closed(종료). 서로 모두 오갈 수 있게 두고, 새 티켓은 QA Review.
#                       Jira 는 완료 범주 상태 하나를 Closed 로 읽는다(한국어 계정에서 "종료"로 보여도 된다).
#   우선순위 이름 — 8칸과 같은 Critical · Major · Minor · Trivial.
#   연결 확인(uv run triage-serve --check)이 다섯 상태가 있는지 본다.
# ─────────────────────────────────────────────────────────────

[bts]
use = "fake"        # fake(같은 DB 에 저장하는 가짜 BTS) | jira | redmine

# ── 생성 시 자동 배정 (src/triage_service/assign.py) ────────
# 사람이 확정한 8칸으로 받을 팀을 정한다. 이 섹션을 지우면 배정하지 않는다.
#   [처리] 등록(재현 대기)·정보 요청 후 보류 → qa 팀
#   [처리] 긴급 사인 요청                  → qa 팀장 (판정 기준서 §0 — 리드 QA 가 사인한 뒤 개발팀에 넘긴다)
#   [처리] 개발 배정                      → 첫 [모듈]의 팀 (모듈이 "해당 없음"이면 qa 팀)
#   [처리] CS 응대                       → cs 팀 (지우면 배정하지 않음)
# 팀은 BTS 그룹이다(아래 [jira.teams]·[redmine.teams]). 담당자는 그 그룹 구성원 중 미해결이 가장 적은 사람이고,
# 팀장은 [jira.leads]·[redmine.leads] 에 적는다(qa 팀장은 필수). 검토 화면에서 팀·담당자를 바꿀 수 있다.
[assign]
qa = "QA"
cs = "운영"

[assign.modules]    # 10개 모듈 → 개발팀 (빠지면 서버가 시작하지 않는다)
"클라이언트 안정성" = "클라"
"플랫폼 호환성" = "클라"
"UI·텍스트" = "클라"
"네트워크" = "서버"
"계정·로그인" = "서버"
"결제·재화" = "서버"
"보안·어뷰징" = "서버"
"그래픽·사운드" = "아트"
"게임플레이·밸런스" = "기획"
"콘텐츠 진행" = "기획"

# ── Jira Cloud (REST API v3) ────────────────────────────────
[jira]
base_url = "https://your-site.atlassian.net"   # 무료 사이트 주소
project_key = "TRI"                             # 프로젝트(공간) 키 — 주소창 /projects/<키>/ 부분
issue_type = "Bug"                              # 회사 관리형 프로젝트는 Bug. 팀 관리형 공간에 Bug 가 없으면 "작업"(Task) 등 실제 유형 이름
labels = ["triage"]                             # 모든 티켓에 붙일 라벨. 모듈은 라벨로 붙는다(공백은 _)
timeout_sec = 10

[jira.priority]     # 8칸 [우선순위] → Jira 우선순위 이름. 사이트 우선순위를 8칸 이름으로 바꿔 둔다
Critical = "Critical"   # (Jira 기본값 Highest·High·Medium·Low 를 그대로 쓰면 Critical = "Highest" 처럼 적는다)
Major = "Major"
Minor = "Minor"
Trivial = "Trivial"
"판단보류" = "Minor"
"해당 없음" = "Trivial"

[jira.teams]        # 팀 → Jira 그룹 이름 (관리 → 사용자 관리 → 그룹). 구성원이 그 프로젝트의 담당자가 될 수 있는지 --check 가 검사한다
QA = "QA팀"
"운영" = "운영팀"
"클라" = "클라팀"
"서버" = "서버팀"
"아트" = "아트팀"
"기획" = "기획팀"

[jira.leads]        # 팀 → 팀장 계정 ID (accountId — Jira 사용자 프로필 주소의 /people/<ID> 부분). QA 는 필수(긴급 사인 요청), 그 그룹 구성원이어야 한다
QA = "your-qa-lead-account-id"

# ── Redmine (REST API) ─────────────────────────────────────
[redmine]
base_url = "http://127.0.0.1:3000"   # 로컬 Docker Redmine
project_id = "triage"                # 프로젝트 식별자
tracker_id = 1                       # 유형 번호 (영문 기본 데이터: 1 = Bug)
# module_field_id = 1                # 모듈을 넣을 사용자 정의 필드 번호(목록·여러 값, 선택지는 8칸 모듈 이름). 관리자가 만든 뒤 번호를 적는다. 없으면 설명에만 남긴다
# sprint_field_id = 2                # 목표 스프린트를 넣을 사용자 정의 필드 번호(날짜 형식). 관리자가 만든 뒤 번호를 적는다. 없으면 넣지 않는다
timeout_sec = 10

[redmine.priority]  # 8칸 [우선순위] → Redmine 우선순위 번호 (영문 기본 데이터 번호 1 Low · 2 Normal · 3 High · 5 Immediate 의 이름을 Trivial · Minor · Major · Critical 로 바꿔 씀)
Critical = 5
Major = 3
Minor = 2
Trivial = 1
"판단보류" = 2
"해당 없음" = 1

[redmine.teams]     # 팀 → Redmine 그룹 번호 (그룹을 프로젝트 구성원으로 넣는다. 구성원 읽기에 관리자 API 키 필요)
                    # 프로젝트에 팀 이름과 같은 일감 범주도 만들어 둔다(Jira 의 "팀_" 라벨 대신, --check 가 확인)
QA = 11
"운영" = 12
"클라" = 13
"서버" = 14
"아트" = 15
"기획" = 16

[redmine.leads]     # 팀 → 팀장 사용자 번호. QA 는 필수(긴급 사인 요청), 그 그룹 구성원이어야 한다
QA = 1
