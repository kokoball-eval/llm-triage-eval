[project]
name = "game-bug-triage-eval"
version = "0.1.0"
description = "LLM에게 1차 트리아지를 맡길 때, 그 판단을 평가셋·회귀 게이트·사전 등록 비교로 검증하는 평가 체계 (검증 사례: 게임 버그 리포트)"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "openai>=3.13.0",
]

# 실행 명령 — `uv run <명령>` 으로 실행한다 (v1.3 구조 정리). `uv run python -m <모듈>` 로도 실행할 수 있다.
[project.scripts]
# 현역 트리아지 파이프라인 (평가셋 aether_raid_v13 · aether_raid_v14)
triage-run = "triage_eval.pipeline.run:main"
triage-score = "triage_eval.pipeline.score:main"
triage-gate = "triage_eval.pipeline.gate:main"
triage-screen = "triage_eval.pipeline.screen:main"
triage-select = "triage_eval.pipeline.selection:main"
triage-compare = "triage_eval.pipeline.compare:main"
triage-agreement = "triage_eval.pipeline.agreement:main"
triage-rescore = "triage_eval.pipeline.rescore:main"
triage-judge = "triage_eval.pipeline.judge:main"
# v1.0 모델 선정 벤치마크 (동결)
bench-run = "triage_eval.bench_v1.run_eval:main"
bench-gate = "triage_eval.bench_v1.compare_runs:main"
bench-summarize = "triage_eval.bench_v1.summarize_eval:main"
bench-capture-env = "triage_eval.bench_v1.capture_env:main"
bench-score-format = "triage_eval.common.score_format:main"
bench-hallucination = "triage_eval.common.detect_hallucination:main"

# src/triage_eval 을 패키지로 설치한다. uv 가 편집 가능 모드로 설치하므로 코드를 고치면 바로 반영되고,
# 폴더 깊이와 관계없이 `triage_eval.<하위 패키지>` 로 import 된다.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_eval"]

[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 패키지 설치 전에도 테스트가 src/triage_eval 을 import 할 수 있게 경로에 추가
pythonpath = ["src"]
testpaths = ["tests"]
