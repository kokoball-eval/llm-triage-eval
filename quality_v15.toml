# ─────────────────────────────────────────────────────────────
# v1.5 요약 품질 LLM-as-judge 판단 기준 — 측정 세트 46건(리포트당 1건: 자연 31 + 결함 주입 15)
#
# 계획: report/quality_v15_plan.md
# 검토자 채점과 채점관 측정 전에 확정한다 (2026-10-29). 결과를 본 뒤 이 파일의 값을 바꾸지 않는다.
#
# 판단 규칙
#   1. 판정은 "품질 문제 있음 / 없음". 유형(Q1 대상 누락·Q2 오해 소지·Q3 문장 결함)은 기록만 한다.
#      원문에 없는 사실(날조)은 이번 판정 대상이 아니다(날조는 judge_v15 에서 따로 쟀다).
#      단, 이슈의 성격을 바꾸는 서술(건의 → 오류, 의심 → 확정 등)은 날조가 아니라 Q2로 본다.
#   2. 판정에 쓰는 지표가 모두 기준을 충족하면(기준값과 같아도 충족) 채택, 하나라도 충족하지 못하면 미채택.
#   3. 검토자가 자연 응답에서 문제 있음으로 본 건이 min_positive_for_kappa 미만이면 κ는 기록만 하고 판정에 쓰지 않는다.
#   4. 결함 주입은 유형이 달라도 "문제 있음"이면 검출로 센다. 유형별 일치는 기록만 한다.
#   5. 채점관 출력을 두 번 읽지 못한 건은 불일치·놓침·거짓 경보로 센다. 실행 도중 모델 재로드는 측정 무효.
#   6. 요약 품질은 날조보다 판단 폭이 넓어, 일치율·검출률·거짓 경보 기준을 날조 측정(90%·90%·10%)보다 한 단계 느슨하게 둔다.
#      일치율 85%는 v1.5 라벨 일치율 기준과 같다.
# ─────────────────────────────────────────────────────────────

[meta]
version = "1.5"
judge_model = "gemma4:12b"      # 날조 측정과 같은 채점관 (한 번에 하나만 바꾼다 — 이번에 바뀌는 것은 판정 대상)
rater = "검토자"
measure_set = "data/quality_v15/measure_set_v15.json"
answer_key = "data/quality_v15/answer_key_v15.json"
dev_set = "data/quality_v15/dev_set_v15.json"
practice = "data/quality_v15/practice_v15.json"

# ── 자연 응답 31건 ───────────────────────────────────────────
[natural]
agreement_min = 85.0            # 검토자와 채점관의 판정이 같은 비율(%). 31건 중 27건 이상(26.35 → 27)
kappa_min = 0.61                # 검토자 대 채점관 Cohen κ. Landis·Koch(1977) "상당한 일치"의 시작
min_positive_for_kappa = 5      # 검토자의 문제 있음이 이보다 적으면 κ는 판정에 쓰지 않는다
false_alarm_max = 15.0          # 검토자가 없음으로 본 응답 중 채점관이 있음으로 본 비율(%)의 상한

# ── 결함 주입 15건 ───────────────────────────────────────────
[injected]
recall_min = 80.0               # 채점관이 문제 있음으로 본 비율(%). 15건 중 12건 이상
