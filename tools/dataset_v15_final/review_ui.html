<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최종 평가용 세트 검토</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#5b6475; --line:#d9dee7; --accent:#1f5fbf;
          --bad:#b3261e; --ok:#1e7a3c; --flag:#fff8e1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "맑은 고딕","Malgun Gothic",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  #progress { color:var(--muted); margin-left:auto; }
  main { max-width:1280px; margin:0 auto; padding:16px; }
  .grid { display:grid; grid-template-columns: 1.1fr 1fr; gap:14px; }
  @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .card h2 { font-size:15px; margin:0 0 8px; color:var(--muted); }
  .field { margin-bottom:10px; }
  .field .k { font-size:12px; color:var(--muted); font-weight:700; }
  .field .v { white-space:pre-wrap; word-break:break-word; }
  table.lab { border-collapse:collapse; width:100%; margin-bottom:10px; }
  table.lab td, table.lab th { border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top; }
  table.lab th { width:96px; background:#f0f3f8; font-size:13px; }
  .first { font-weight:700; }
  .flag { background:var(--flag); border:1px solid #e0c35a; border-radius:6px; padding:8px 10px; margin-bottom:10px; }
  .flag.need { border-color:var(--bad); background:#fdecea; }
  .rat { color:var(--muted); font-size:13px; white-space:pre-wrap; }
  .row { margin:10px 0; }
  .row .lab2 { font-weight:700; margin-bottom:4px; }
  .btn { border:2px solid var(--line); background:#fff; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:15px; margin:0 6px 6px 0; }
  .btn.ok.on { border-color:var(--ok); background:#e7f5ec; color:var(--ok); font-weight:700; }
  .btn.fix.on { border-color:var(--bad); background:#fdecea; color:var(--bad); font-weight:700; }
  .edit { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:6px; }
  .edit.off { opacity:.45; }
  .edit input[type=text], .edit textarea { width:100%; font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; }
  .edit small { color:var(--muted); }
  textarea.memo { width:100%; min-height:56px; font:inherit; padding:6px; border:1px solid var(--line); border-radius:6px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  #msg { margin-left:6px; font-weight:600; }
  #msg.err { color:var(--bad); } #msg.ok { color:var(--ok); }
  select { font:inherit; padding:4px; }
  .state { font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>최종 평가용 세트 검토</h1>
  <select id="filter"><option value="open">검토할 문항만</option><option value="all">전체</option></select>
  <span id="progress"></span>
</header>
<main>
  <p><b>질문:</b> 이 문항의 본문이 적절하고, 제안 라벨(첫 값이 가장 바람직한 답, 나머지는 허용 답)이 기준서에 맞습니까? 맞으면 <b>승인</b>, 아니면 <b>수정 필요</b>로 고칠 칸과 맞는 값을 적습니다.
    이 화면에는 모델 응답이 없습니다.</p>
  <div class="grid">
    <section class="card">
      <h2 id="src-title">문항</h2>
      <div id="source"></div>
    </section>
    <section class="card">
      <h2>제안 라벨</h2>
      <div id="flags"></div>
      <table class="lab" id="labels"></table>
      <div class="rat" id="rat"></div>
      <div class="row">
        <div class="lab2">결정 <span class="state" id="state"></span></div>
        <button class="btn ok" data-d="승인">승인</button>
        <button class="btn fix" data-d="수정 필요">수정 필요</button>
      </div>
      <div id="edits" hidden></div>
      <div class="row">
        <div class="lab2">메모 (선택)</div>
        <textarea class="memo" id="memo" placeholder="판단 이유, 다듬을 문구 등"></textarea>
      </div>
      <div class="actions">
        <button class="btn" id="prev">◀ 이전</button>
        <button class="btn primary" id="save">저장</button>
        <button class="btn" id="next">다음 ▶</button>
        <select id="jump"></select>
        <span id="msg"></span>
      </div>
    </section>
  </div>
</main>
<script>
const S = { idx: 0, data: null, decision: null, dirty: false, busy: false, filter: "open" };
const $ = (id) => document.getElementById(id);
const EDITS = [["분류","label"],["우선순위","label"],["모듈","label"],["재현 정보","label"],["처리","label"],["발생 빈도","label"],
               ["위험","risk"],["사람 검토","review"],["본문","text"],["교체","text"]];
const HELP = { "위험":"X-1, X-2, X-3 중 하나 또는 없음", "사람 검토":"예 / 아니오", "본문":"무엇을 어떻게 바꿀지(어색한 문구, 정답 단서 등)", "교체":"문항 자체가 부적절한 이유" };
function say(t, k) { $("msg").textContent = t; $("msg").className = k || ""; }
function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function inline(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
const items = () => S.data.items;
const ans = (r) => S.data.answers[r["번호"]];
function status(r) {
  const a = ans(r);
  if (!a) return "미검토";
  if (a["결정"] === "수정 필요") return "수정 필요(대기)";
  return a.hash === r.hash ? "승인" : "승인 뒤 문항이 바뀜 — 다시 검토";
}
const isOpen = (r) => status(r) !== "승인";
function visible() { return items().map((r, i) => [r, i]).filter(([r]) => S.filter === "all" || isOpen(r)); }
async function load() {
  if (location.protocol === "file:") {   // 파일로 직접 열면 서버가 없어 저장할 수 없다
    say("이 화면은 서버와 함께 열어야 저장됩니다. 파일로 직접 열지 말고 검토 서버(final-review)를 켠 뒤 http://127.0.0.1:8767 로 여세요", "err");
    return;
  }
  try {
    const res = await fetch("/api/state");
    S.data = await res.json();
    if (!res.ok) { say(S.data.error || "불러오지 못했습니다", "err"); return; }
  } catch (e) { say("서버에 연결할 수 없습니다. 검토 화면 서버가 켜져 있는지 확인하세요", "err"); return; }
  const open = visible();
  S.idx = open.length ? open[0][1] : 0;
  buildEdits(); render();
}
function buildEdits() {
  $("edits").innerHTML = EDITS.map(([k, t]) => `<div class="edit off" data-k="${k}"><label><input type="checkbox"> <b>${k}</b></label>
    <div>${t === "text" ? `<textarea rows="2" disabled></textarea>` : `<input type="text" disabled>`}<small>${HELP[k] || ("값: " + S.data.vocab[k].join(" / ") + " — 쉼표로 구분, 첫 값이 가장 바람직한 답")}</small></div></div>`).join("");
  document.querySelectorAll("#edits .edit").forEach(e => {
    const cb = e.querySelector("input[type=checkbox]"), f = e.querySelector("input[type=text], textarea");
    cb.onchange = () => { e.classList.toggle("off", !cb.checked); f.disabled = !cb.checked; S.dirty = true; };
    f.oninput = () => { S.dirty = true; };
  });
}
function renderSource(r) {
  const i = r.input, c = i.context || {};
  const f = [["트랙", r.track === "A" ? "A 커뮤니티 제보" : "B QA 작성 이슈"], ["제보 품질", r.quality]];
  if (r.track === "A") f.push(["게시판", i.board], ["게시 일시", i.posted_at]); else f.push(["작성자", i.reporter]);
  f.push(["제목", i.title], ["본문", i.body], ["참고: 업데이트 공지", c.update_note], ["참고: 기존 등록 이슈", (c.known_issues || []).join("\n")]);
  $("source").innerHTML = f.map(([k, v]) => `<div class="field"><div class="k">${esc(k)}</div><div class="v">${esc(String(v || "").trim() || "(없음)")}</div></div>`).join("");
}
function renderLabels(r) {
  const L = r.labels, first = (a) => a.map((x, j) => j ? esc(x) : `<span class="first">${esc(x)}</span>`).join(" / ");
  const rows = [["분류", first(L["분류"])], ["우선순위", first(L["우선순위"])], ["모듈", first(L["모듈"])], ["재현 정보", first(L["재현 정보"])],
    ["처리", first(L["처리"])], ["발생 빈도", first(L["발생 빈도"])], ["위험", L.risk.length ? esc(L.risk.join(", ")) : "—"],
    ["사람 검토", L.human_review ? "예" : "아니오"]];
  if (L.must_request.length) rows.push(["꼭 요청할 정보", esc(L.must_request.join(", "))]);
  if (L.must_recommend.length) rows.push(["꼭 권장할 조치", esc(L.must_recommend.join(", "))]);
  $("labels").innerHTML = rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("");
  $("rat").textContent = "근거: " + r.rationale;
  $("flags").innerHTML = r.flags.map(t => `<div class="flag ${t.startsWith("**결정 필요") ? "need" : ""}">${inline(t)}</div>`).join("");
}
function render() {
  const r = items()[S.idx], a = ans(r);
  $("src-title").textContent = r["번호"];
  renderSource(r); renderLabels(r);
  S.decision = a ? a["결정"] : null;
  $("state").textContent = "— " + status(r);
  document.querySelectorAll("#edits .edit").forEach(e => {
    const k = e.dataset.k, cb = e.querySelector("input[type=checkbox]"), f = e.querySelector("input[type=text], textarea");
    const has = !!(a && a["수정"] && k in a["수정"]);
    cb.checked = has; f.disabled = !has; e.classList.toggle("off", !has);
    f.value = has ? (Array.isArray(a["수정"][k]) ? a["수정"][k].join(", ") : a["수정"][k]) : "";
  });
  $("memo").value = a ? a["메모"] : "";
  syncDecision();
  const list = visible();
  $("jump").innerHTML = items().map((x, i) => `<option value="${i}" ${i === S.idx ? "selected" : ""}>${isOpen(x) ? "·" : "✓"} ${x["번호"]}${ans(x) && ans(x)["결정"] === "수정 필요" ? " (수정)" : ""}</option>`).join("");
  const done = items().filter(x => !isOpen(x)).length;
  $("progress").textContent = `승인 ${done}/${items().length} · 검토할 문항 ${list.length}개`;
  S.dirty = false; say(""); window.scrollTo(0, 0);
}
function syncDecision() {
  document.querySelectorAll(".btn[data-d]").forEach(b => b.classList.toggle("on", b.dataset.d === S.decision));
  $("edits").hidden = S.decision !== "수정 필요";
}
function leaveOk() { return !S.dirty || confirm("저장하지 않은 입력이 있습니다. 저장하지 않고 이동할까요?"); }
function go(fn) { if (leaveOk()) { fn(); render(); } else { $("jump").value = S.idx; } }
document.querySelectorAll(".btn[data-d]").forEach(b => b.onclick = () => { S.decision = b.dataset.d; S.dirty = true; syncDecision(); });
$("memo").oninput = () => { S.dirty = true; };
function step(dir) {
  const list = visible().map(([, i]) => i);
  const nxt = dir > 0 ? list.find(i => i > S.idx) : [...list].reverse().find(i => i < S.idx);
  const fb = dir > 0 ? Math.min(S.idx + 1, items().length - 1) : Math.max(S.idx - 1, 0);
  return nxt === undefined ? fb : nxt;
}
$("prev").onclick = () => { if (S.idx > 0) go(() => { S.idx = step(-1); }); };
$("next").onclick = () => { if (S.idx < items().length - 1) go(() => { S.idx = step(1); }); };
$("jump").onchange = (e) => go(() => { S.idx = Number(e.target.value); });
$("filter").onchange = (e) => { S.filter = e.target.value; render(); };
window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
$("save").onclick = async () => {
  if (S.busy) return;
  const r = items()[S.idx], edits = {};
  document.querySelectorAll("#edits .edit").forEach(e => {
    const cb = e.querySelector("input[type=checkbox]");
    if (cb.checked && S.decision === "수정 필요") edits[e.dataset.k] = e.querySelector("input[type=text], textarea").value;
  });
  const payload = { "번호": r["번호"], "결정": S.decision, "수정": edits, "메모": $("memo").value };
  S.busy = true; $("save").disabled = true;
  let res, out;
  try {
    res = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    out = await res.json();
  } catch (e) { say("저장하지 못했습니다 — 서버 연결을 확인하세요", "err"); return; }
  finally { S.busy = false; $("save").disabled = false; }
  if (!res.ok) { say(out.error, "err"); return; }
  S.data.answers[r["번호"]] = out.saved;
  const last = visible().every(([, i]) => i <= S.idx);
  const nxt = last ? S.idx : step(1);
  S.dirty = false; S.idx = nxt; render();
  say(last ? "저장됨 — 마지막 검토 문항입니다. '검토할 문항만' 목록이 비었는지 확인하세요" : "저장됨 — 다음 문항", "ok");
};
load();
</script>
</body>
</html>
