<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요약 날조 확인</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2330; --card:#fff; --line:#d7dbe3; --mut:#5b6475; --acc:#2456d6; --bad:#c0392b; --ok:#1f8a4c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --fg:#e6e9ef; --card:#1d222b; --line:#323a47; --mut:#9aa4b5; --acc:#6c93ff; --bad:#ff7b6b; --ok:#4cc58a; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; }
  .mut { color:var(--mut); font-size:13px; }
  pre { white-space:pre-wrap; word-break:break-word; margin:6px 0 0; font:inherit; }
  .summary { border-left:4px solid var(--acc); padding-left:12px; }
  button { font:inherit; padding:9px 18px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.yes { border-color:var(--bad); color:var(--bad); } button.no { border-color:var(--ok); color:var(--ok); }
  button.sel { font-weight:700; outline:2px solid currentColor; }
  textarea { width:100%; box-sizing:border-box; min-height:60px; font:inherit; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .msg { color:var(--bad); min-height:1.4em; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:20px;margin:6px 0">요약 날조 확인</h1>
  <div class="card"><strong>판정 기준</strong><div id="def" class="mut"></div></div>
  <div class="bar">
    <span id="progress"></span>
    <label><input type="checkbox" id="onlyTodo" checked> 확인하지 않은 것만</label>
    <button id="prev">이전</button><button id="next">다음</button>
  </div>
  <div id="msg" class="msg"></div>
  <div id="view"></div>
</main>
<script>
"use strict";
let S = null, idx = 0;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

async function load() {
  if (location.protocol === "file:") { $("msg").textContent = "이 파일을 직접 열면 저장되지 않습니다. 서버 주소(http://127.0.0.1:8769)로 여세요."; return; }
  const r = await fetch("/api/state");
  const j = await r.json();
  if (!r.ok) { $("msg").textContent = j.error || "불러오지 못했습니다"; return; }
  S = j; $("def").textContent = S.definition; render();
}
function list() { return S.groups.filter((g) => !$("onlyTodo").checked || !S.answers[g.id]); }
function render() {
  const L = list(); const done = S.groups.filter((g) => S.answers[g.id]).length;
  $("progress").textContent = `확인 ${done}/${S.groups.length}묶음 · 지금 목록 ${L.length}건`;
  if (!L.length) { $("view").innerHTML = '<div class="card">확인할 묶음이 없습니다. 모두 끝났다면 알려 주세요.</div>'; return; }
  idx = Math.max(0, Math.min(idx, L.length - 1));
  const g = L[idx], a = S.answers[g.id] || {}, inp = g.input, ctx = inp.context || {};
  const meta = [inp.board, inp.posted_at, inp.reporter].filter(Boolean).join(" · ");
  const known = (ctx.known_issues || []).map((k) => `<li>${esc(k)}</li>`).join("");
  $("view").innerHTML = `
    <div class="card"><div class="mut">리포트 원문 ${meta ? "· " + esc(meta) : ""}</div>
      <strong>${esc(inp.title)}</strong><pre>${esc(inp.body)}</pre>
      <div class="mut" style="margin-top:8px">업데이트 공지: ${esc(ctx.update_note || "—")}</div>
      <div class="mut">기존 등록 이슈:</div><ul class="mut" style="margin:2px 0">${known || "<li>없음</li>"}</ul></div>
    <div class="card"><div class="mut">응답의 [요약]</div><div class="summary"><pre>${esc(g.summary)}</pre></div></div>
    <div class="card"><div class="bar">
      <button class="yes ${a["결정"] === "날조 있음" ? "sel" : ""}" data-d="날조 있음">날조 있음 (1)</button>
      <button class="no ${a["결정"] === "날조 없음" ? "sel" : ""}" data-d="날조 없음">날조 없음 (2)</button>
      <span class="mut">${a["결정"] ? "저장됨: " + esc(a["결정"]) : ""}</span></div>
      <p class="mut">판단이 어려우면 메모를 남기고 하나를 고르세요.</p>
      <textarea id="memo" placeholder="메모 (선택)">${esc(a["메모"] || "")}</textarea></div>`;
  document.querySelectorAll("button[data-d]").forEach((b) => b.onclick = () => save(g.id, b.dataset.d));
}
async function save(id, decision) {
  $("msg").textContent = "";
  const r = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, 결정: decision, 메모: $("memo").value }) });
  const j = await r.json();
  if (!r.ok) { $("msg").textContent = j.error || "저장하지 못했습니다"; return; }
  S.answers[id] = j.saved;
  if ($("onlyTodo").checked) { render(); } else { idx++; render(); }
}
$("next").onclick = () => { idx++; render(); };
$("prev").onclick = () => { idx--; render(); };
$("onlyTodo").onchange = () => { idx = 0; render(); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  const L = list(); if (!L.length) return;
  if (e.key === "1") save(L[idx].id, "날조 있음"); else if (e.key === "2") save(L[idx].id, "날조 없음");
});
load();
</script>
</body>
</html>
