# ─────────────────────────────────────────────────────────────
# v1.5 LLM-as-judge 판단 기준 — 요약 날조 판정, 측정 세트 63건(리포트당 1건: 자연 43 + 결함 주입 20)
#
# 계획: report/judge_v15_plan.md
# 검토자 채점과 채점관 측정 전에 확정한다 (2026-10-15). 결과를 본 뒤 이 파일의 값을 바꾸지 않는다.
#
# 판단 규칙
#   1. 판정에 쓰는 지표가 모두 기준을 충족하면(기준값과 같아도 충족) 채택, 하나라도 충족하지 못하면 미채택.
#   2. 검토자가 자연 응답에서 날조 있음으로 본 건이 min_positive_for_kappa 미만이면 κ는 기록만 하고 판정에 쓰지 않는다.
#   3. 자연 응답 검출 건수, 주입 검출(문구 무관), 검토자의 주입 검출률, v1.2 탐지기 판정은 기록만 한다.
#   4. 채점관 출력을 두 번 읽지 못한 건은 불일치·놓침으로 센다. 실행 도중 모델 재로드는 측정 무효(계획 §4).
# ─────────────────────────────────────────────────────────────

[meta]
version = "1.5"
judge_model = "gemma4:12b"      # 응답을 만든 qwen2.5:7b 와 다른 모델 (자기 채점 편향 방지)
rater = "검토자"
measure_set = "data/judge_v15/measure_set_v15.json"
answer_key = "data/judge_v15/answer_key_v15.json"
dev_set = "data/judge_v15/dev_set_v15.json"

# ── 자연 응답 43건 ───────────────────────────────────────────
[natural]
agreement_min = 90.0            # 검토자와 채점관의 판정이 같은 비율(%). 43건 중 39건 이상
kappa_min = 0.61                # 검토자 대 채점관 Cohen κ. Landis·Koch(1977) "상당한 일치"의 시작
min_positive_for_kappa = 5      # 검토자의 날조 있음이 이보다 적으면 κ는 판정에 쓰지 않는다
false_alarm_max = 10.0          # 검토자가 없음으로 본 응답 중 채점관이 있음으로 본 비율(%)의 상한

# ── 결함 주입 20건 ───────────────────────────────────────────
[injected]
recall_min = 90.0               # 주입한 날조를 채점관이 있음으로 본 비율(%). 20건 중 18건 이상
credit_requires_key = true      # 채점관이 지목한 문구에 주입 핵심어가 있어야 검출로 센다 (다른 곳을 지목해 맞힌 것 제외)
